name: CI

# Runs the full suite on every push and pull request. The integration tests need
# a real PostgreSQL, so one is provided as a service container — the guarantees they
# check (row locking, unique constraints, CHECK constraints) cannot be verified
# against a mock.
on:
  push:
    # Not dev: a push there runs this same suite inside deploy-dev.yml's gate,
    # so that the build which gets published is one that passed.
    branches: [main, staging]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Docker Hub's official image, the one bkesari-platform's CI uses. This
        # was public.ecr.aws/docker/library/postgres:16 to dodge Docker Hub's
        # anonymous rate limit, until ECR Public refused every pull with "Data
        # limit exceeded" (2026-10-24). If Docker Hub's limit bites again,
        # mirror.gcr.io/library/postgres:16 is the next mirror to try.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dairy_bakery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U postgres -d dairy_bakery_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # CI never reaches Neon or any real tier: one local PostgreSQL service, and
    # one URL for everything (with no DATABASE_URL_UNPOOLED, migrations use
    # DATABASE_URL). tests/setup.ts refuses a TEST_DATABASE_URL that is not on
    # this machine.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dairy_bakery_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dairy_bakery_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src tests --ext .ts,.tsx

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      # The rules that keep a deploy off test and production. Cheap, and the
      # one thing here whose failure mode is publishing to the wrong tier.
      - name: Deploy guard rules
        run: bash .github/deploy/guard.test.sh
