name: CI

# Runs the full suite on every push and pull request. The integration tests need
# a real MySQL, so one is provided as a service container — the guarantees they
# check (row locking, unique constraints, CHECK constraints) cannot be verified
# against a mock.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        # Matches the MySQL 8 that Hostinger provides; CHECK constraints need
        # 8.0.16 or newer, which the schema relies on.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: dairy_bakery_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -umysql -pmysql || mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:mysql@127.0.0.1:3306/dairy_bakery_test
      TEST_DATABASE_URL: mysql://root:mysql@127.0.0.1:3306/dairy_bakery_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      CRON_SECRET: ci-only-cron-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src tests --ext .ts,.tsx

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build
