<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bkesari — coming soon</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdfaf5;
    --fg: #2b2320;
    --accent: #b5651d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #201a16; --fg: #f3ece4; --accent: #e0975a; }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 1.5rem;
  }
  main { max-width: 32rem; }
  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
  }
  p {
    font-size: 1.1rem;
    line-height: 1.5;
    opacity: 0.8;
    margin: 0;
  }
  .accent { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1><span class="accent">bkesari</span></h1>
  <p>Shops and milk products. Our site is on its way — check back soon.</p>
</main>
</body>
</html>
